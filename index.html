<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snooker</title>
<meta name="theme-color" content="#15181a">
<style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Oswald"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/oswald-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Oswald"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/oswald-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Oswald"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/oswald-latin-600-normal.woff2) format("woff2"); }

  :root {
    --slate: #15181a;
    --slate-rail: #1c2124;
    --slate-sink: #0f1113;
    --baize: #13503a;
    --baize-lit: #1a6b4c;
    --brass: #c9a24a;
    --brass-dim: #8a6f33;
    --chalk: #f2ece0;
    --chalk-dim: #9aa39c;

    --ball-red: #c4231f;
    --ball-yellow: #e8c23a;
    --ball-green: #1f7a46;
    --ball-brown: #6b4328;
    --ball-blue: #1f5fb0;
    --ball-pink: #e2749a;
    --ball-black: #141414;

    --display: "Instrument Serif", Georgia, serif;
    --board: "Oswald", ui-sans-serif, system-ui, sans-serif;

    --step: clamp(0.9rem, 0.85rem + 0.3vw, 1rem);
    --score: clamp(2.2rem, 1.4rem + 3vw, 3.6rem);
    --radius: 10px;
  }

  html { min-height: 100%; background: var(--slate-sink); }
  /* min-height, not height: the gradient has to stretch with a board taller than the screen */
  body { min-height: 100%; box-sizing: border-box; }
  body {
    margin: 0;
    /* env() keeps the board clear of the notch and home indicator on iPhone */
    padding-top: max(clamp(1rem, 0.6rem + 1.6vw, 2rem), env(safe-area-inset-top));
    padding-bottom: max(clamp(1rem, 0.6rem + 1.6vw, 2rem), env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    background:
      radial-gradient(130% 60% at 50% -10%, #23292b 0%, var(--slate) 55%, var(--slate-sink) 100%);
    color: var(--chalk);
    font-family: var(--board);
    font-size: var(--step);
    -webkit-font-smoothing: antialiased;
  }

  .board { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(1rem, 0.7rem + 1.2vw, 1.75rem); }

  /* ---------- header ---------- */
  .masthead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.75rem 1.5rem; border-bottom: 1px solid var(--brass-dim); padding-bottom: 0.75rem; }
  .masthead h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 1.4rem + 2vw, 2.9rem); line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .masthead h1 em { color: var(--brass); font-style: italic; }
  .masthead .spacer { flex: 1 1 2rem; }

  .eyebrow { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); }

  /* ---------- foul rule switch ---------- */
  .foulrule, .playercount { display: flex; flex-direction: column; gap: 0.35rem; }
  .foulrule[hidden] { display: none; }
  .segments { display: flex; border: 1px solid var(--brass-dim); border-radius: 999px; overflow: hidden; background: var(--slate-sink); }
  .segments button {
    appearance: none; border: 0; background: transparent; color: var(--chalk-dim);
    font-family: var(--board); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.45rem 0.85rem; cursor: pointer; transition: background 160ms ease, color 160ms ease;
  }
  .segments button:hover { color: var(--chalk); background: #24292b; }
  .segments button[aria-pressed="true"] { background: var(--brass); color: #1a1407; }

  /* ---------- player rails ---------- */
  .rails { display: grid; grid-template-columns: repeat(var(--players, 3), 1fr); gap: 0.75rem; }
  .rail[hidden] { display: none; }
  .rail {
    position: relative; display: flex; flex-direction: column; gap: 0.3rem;
    padding: 0.6rem 0.8rem 0.7rem; border-radius: var(--radius);
    background: var(--slate-rail); border: 1px solid #262c2f; border-left: 4px solid #2c3337;
    transition: background 220ms ease, border-color 220ms ease, transform 220ms ease;
  }
  .rail.at-table {
    background: linear-gradient(160deg, var(--baize-lit) 0%, var(--baize) 70%);
    border-color: var(--brass-dim); border-left-color: var(--brass);
    box-shadow: 0 10px 28px -16px #000, inset 0 1px 0 #ffffff1f;
  }
  .rail .turn { min-height: 1rem; color: var(--brass); opacity: 0; transition: opacity 200ms ease; }
  .rail.at-table .turn { opacity: 1; }
  .rail input {
    appearance: none; border: 0; border-bottom: 1px dotted #ffffff2e; background: transparent;
    color: var(--chalk); font-family: var(--board); font-size: 0.95rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 0.1rem 0 0.2rem; width: 100%; min-width: 0;
  }
  .rail input::placeholder { color: var(--chalk-dim); }
  .rail input:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 3px; }
  .rail .score {
    font-size: var(--score); font-weight: 500; line-height: 0.95; font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em; transition: transform 140ms ease;
  }
  .rail .score.bump { transform: scale(1.06); }
  .rail .tally { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
  .rail.at-table .tally { color: #cfe3d6; }

  /* ---------- the table ---------- */
  .table {
    border-radius: var(--radius); padding: clamp(0.9rem, 0.6rem + 1vw, 1.4rem);
    background:
      repeating-linear-gradient(90deg, #ffffff07 0 1px, transparent 1px 4px),
      linear-gradient(175deg, var(--baize-lit), var(--baize) 60%, #0f3f2e);
    border: 6px solid #4a3418; box-shadow: inset 0 3px 18px #00000066, 0 14px 34px -22px #000;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .balls { display: grid; grid-template-columns: repeat(7, 1fr); gap: clamp(0.4rem, 0.2rem + 0.8vw, 0.9rem); }
  .ball {
    position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; cursor: pointer;
    color: #fff; font-family: var(--board); font-size: clamp(1rem, 0.7rem + 1.4vw, 1.6rem); font-weight: 500;
    background-image: radial-gradient(circle at 32% 26%, #ffffffc4 0 6%, #ffffff40 12%, transparent 46%);
    box-shadow: inset 0 -6px 14px #00000073, 0 6px 14px -6px #000;
    transition: transform 110ms ease, box-shadow 110ms ease;
  }
  .ball:hover { transform: translateY(-3px); box-shadow: inset 0 -6px 14px #00000073, 0 12px 20px -8px #000; }
  .ball:active { transform: translateY(1px) scale(0.97); }
  .ball:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
  .ball.potted { visibility: hidden; }
  .ball[disabled] { cursor: not-allowed; opacity: 0.32; transform: none; box-shadow: inset 0 -6px 14px #00000073; }
  .ball .left {
    position: absolute; inset-inline: 0; bottom: -1.35rem; font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--chalk); font-variant-numeric: tabular-nums;
  }
  .b-red { background-color: var(--ball-red); }
  .b-yellow { background-color: var(--ball-yellow); color: #2a2202; }
  .b-green { background-color: var(--ball-green); }
  .b-brown { background-color: var(--ball-brown); }
  .b-blue { background-color: var(--ball-blue); }
  .b-pink { background-color: var(--ball-pink); color: #40131f; }
  .b-black { background-color: var(--ball-black); }

  .cushion { height: 1px; background: linear-gradient(90deg, transparent, #ffffff2b, transparent); margin-top: 0.6rem; }

  /* ---------- fouls + actions ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.75rem; align-items: flex-end; }
  .group { display: flex; flex-direction: column; gap: 0.4rem; }
  .group .eyebrow { color: #d8ebdf; }
  .row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    appearance: none; cursor: pointer; font-family: var(--board); font-size: 0.85rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0.5rem 0.8rem; border-radius: 6px;
    color: var(--chalk); background: #0d2c20cc; border: 1px solid #ffffff2b;
    font-variant-numeric: tabular-nums; transition: background 140ms ease, border-color 140ms ease, transform 110ms ease;
  }
  .chip:hover { background: #0a2419; border-color: var(--chalk); }
  .chip:active { transform: translateY(1px); }
  .chip:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
  .chip.primary { background: var(--brass); border-color: var(--brass); color: #1a1407; }
  .chip.primary:hover { background: #dcb257; }
  .chip.quiet { background: transparent; }
  .chip[disabled] { opacity: 0.35; cursor: not-allowed; }
  .chip.armed { background: var(--ball-red); border-color: var(--ball-red); color: #fff; }
  .chip.armed:hover { background: #d62b26; }

  footer { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: space-between; color: var(--chalk-dim); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; }
  kbd { font-family: var(--board); background: #22282a; border: 1px solid #343b3e; border-bottom-width: 2px; border-radius: 4px; padding: 0.05rem 0.3rem; color: var(--chalk); }

  .short { display: none; }

  /* Phone: the whole frame - up to five players, the balls and every control - fits on
     one screen, so nobody scrolls between shots. */
  @media (max-width: 760px) {
    body {
      padding-top: max(0.6rem, env(safe-area-inset-top));
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }
    .board { gap: 0.6rem; }
    .long { display: none; }
    .short { display: inline; }

    .masthead { gap: 0.45rem 0.9rem; padding-bottom: 0.5rem; align-items: center; }
    .masthead h1 { font-size: 1.55rem; flex-basis: 100%; }
    .masthead .spacer { display: none; }
    .foulrule, .playercount { flex-direction: row; align-items: center; gap: 0.4rem; }
    .segments button { min-height: 34px; min-width: 34px; padding: 0.3rem 0.6rem; font-size: 0.7rem; }

    .rails { grid-template-columns: 1fr; gap: 0.35rem; }
    .rail {
      display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name score" "tally score";
      align-items: center; gap: 0 0.75rem; padding: 0.35rem 0.75rem;
    }
    .rail .turn { display: none; }
    .rail .names { grid-area: name; }
    .rail input { font-size: 0.85rem; padding: 0; }
    .rail .tally { grid-area: tally; font-size: 0.66rem; }
    .rail .score { grid-area: score; font-size: 1.9rem; }

    .table { padding: 0.7rem; gap: 0.65rem; border-width: 4px; }
    .table > .group { gap: 0.3rem; }
    .balls { grid-template-columns: repeat(7, 1fr); gap: 0.3rem; padding-bottom: 0.95rem; }
    .ball { font-size: 0.95rem; }
    .ball .left { bottom: -1.05rem; font-size: 0.6rem; letter-spacing: 0.04em; }
    .cushion { display: none; }

    .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; }
    .controls .group, .controls .row { display: contents; }
    .controls .eyebrow { display: none; }
    .chip { padding: 0.55rem 0.3rem; font-size: 0.74rem; letter-spacing: 0.05em; line-height: 1.15; text-align: center; }
    #fouls .chip { order: 1; }
    #red-off { order: 2; grid-column: span 2; }
    #undo { order: 3; }
    #new-frame { order: 4; }
    #end-visit { order: 5; grid-column: 1 / -1; padding: 0.8rem; font-size: 0.9rem; }

    footer { font-size: 0.66rem; }
    footer .keys { display: none; }
  }
  /* Short phones (iPhone SE and friends): tighter still, and the rule note goes - the
     switch in the header already shows it. */
  @media (max-width: 760px) and (max-height: 700px) {
    .masthead h1 { font-size: 1.3rem; }
    .rails { gap: 0.25rem; }
    .rail { padding: 0.2rem 0.7rem; }
    .rail .score { font-size: 1.55rem; }
    .rail .tally { font-size: 0.6rem; }
    .table { padding: 0.55rem; gap: 0.45rem; }
    .chip { padding: 0.5rem 0.3rem; }
    #end-visit { padding: 0.65rem; }
    footer { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0ms !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="board">
  <header class="masthead">
    <h1><span id="handed">Three-Handed</span> <em>Snooker</em></h1>
    <div class="spacer"></div>
    <div class="playercount">
      <span class="eyebrow" id="players-label">Players</span>
      <div class="segments" role="group" aria-labelledby="players-label" id="player-count"></div>
    </div>
    <div class="foulrule" id="foul-rule">
      <span class="eyebrow" id="foul-label"><span class="long">Foul points go to</span><span class="short">Fouls to</span></span>
      <div class="segments" role="group" aria-labelledby="foul-label">
        <button type="button" id="foul-both" aria-pressed="true">All<span class="long"> opponents</span></button>
        <button type="button" id="foul-next" aria-pressed="false">Next<span class="long"> player</span></button>
      </div>
    </div>
  </header>

  <section class="rails" id="rails" aria-label="Scores"></section>

  <section class="table" aria-label="Table">
    <div class="group">
      <span class="eyebrow" id="pot-label">Pot</span>
      <div class="balls" id="balls"></div>
      <div class="cushion"></div>
    </div>

    <div class="controls">
      <div class="group">
        <span class="eyebrow">Foul &mdash; ends the visit</span>
        <div class="row" id="fouls"></div>
      </div>
      <div class="group">
        <span class="eyebrow">Table</span>
        <div class="row">
          <button type="button" class="chip" id="red-off">Red off &mdash; no score</button>
        </div>
      </div>
      <div class="group">
        <span class="eyebrow">Visit</span>
        <div class="row">
          <button type="button" class="chip primary" id="end-visit">End visit</button>
          <button type="button" class="chip" id="undo">Undo</button>
          <button type="button" class="chip quiet" id="new-frame">New frame</button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span id="rule-note">A foul awards its points to all opponents and ends the visit.</span>
    <span class="keys"><kbd>1</kbd>&ndash;<kbd>7</kbd> pot &middot; <kbd>F</kbd> then <kbd>4</kbd>&ndash;<kbd>7</kbd> foul &middot; <kbd>Space</kbd> end visit &middot; <kbd>R</kbd> red off &middot; <kbd>U</kbd> undo</span>
  </footer>
</main>

<script>
  var BALLS = [
    { name: "Red", value: 1, cls: "b-red" },
    { name: "Yellow", value: 2, cls: "b-yellow" },
    { name: "Green", value: 3, cls: "b-green" },
    { name: "Brown", value: 4, cls: "b-brown" },
    { name: "Blue", value: 5, cls: "b-blue" },
    { name: "Pink", value: 6, cls: "b-pink" },
    { name: "Black", value: 7, cls: "b-black" }
  ];
  var STORE = "three-handed-snooker";
  var MIN_PLAYERS = 2, MAX_PLAYERS = 5;
  var HANDED = { 2: "Two-Handed", 3: "Three-Handed", 4: "Four-Handed", 5: "Five-Handed" };

  /* Arrays always hold MAX_PLAYERS seats; `players` says how many are in the frame.
     `on` is the colour to clear next once the reds are gone (8 = table cleared), and
     `freeColour` is the one colour the striker may take, and have re-spotted, right
     after potting the last red. */
  function freshFrame() {
    return {
      players: 3, names: ["", "", "", "", ""], scores: [0, 0, 0, 0, 0], highs: [0, 0, 0, 0, 0],
      current: 0, brk: 0, reds: 15, on: 2, freeColour: false, foulTo: "both"
    };
  }
  function pad(arr, fill) {
    arr = Array.isArray(arr) ? arr.slice(0, MAX_PLAYERS) : [];
    while (arr.length < MAX_PLAYERS) arr.push(fill);
    return arr;
  }

  var state = freshFrame();
  var past = [];

  /* In the iOS app, Capacitor exposes native plugins here. iOS can evict a web view's
     localStorage, so the frame is also kept in native preferences there. */
  var native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    ? window.Capacitor.Plugins : null;

  function restore(raw) {
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.scores)) return;
    // frames saved before the player count existed have three seats and no `players`
    var next = Object.assign(freshFrame(), saved);
    next.players = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, Number(saved.players) || saved.scores.length));
    next.names = pad(next.names, "");
    next.scores = pad(next.scores, 0);
    next.highs = pad(next.highs, 0);
    if (next.current >= next.players) next.current = 0;
    state = next;
  }
  function load() {
    try { restore(localStorage.getItem(STORE)); } catch (e) { /* storage unavailable - start a fresh frame */ }
  }
  function loadNative() {
    if (!native || !native.Preferences) return Promise.resolve();
    return native.Preferences.get({ key: STORE })
      .then(function (r) { restore(r.value); })
      .catch(function () { /* keep whatever localStorage had */ });
  }
  function save() {
    var raw = JSON.stringify(state);
    try { localStorage.setItem(STORE, raw); } catch (e) { /* nothing to do */ }
    if (native && native.Preferences) native.Preferences.set({ key: STORE, value: raw }).catch(function () {});
  }
  function snapshot() {
    past.push(JSON.stringify(state));
    if (past.length > 200) past.shift();
  }

  /* ---------- build the rails and the balls once ---------- */
  var railEls = [];
  var rails = document.getElementById("rails");
  for (var i = 0; i < MAX_PLAYERS; i++) {
    var rail = document.createElement("div");
    rail.className = "rail";
    rail.innerHTML =
      '<span class="eyebrow turn">At the table</span>' +
      '<span class="names"><input id="name-' + i + '" placeholder="Player ' + (i + 1) + '" aria-label="Player ' + (i + 1) + ' name" maxlength="18"></span>' +
      '<span class="score" aria-live="polite">0</span>' +
      '<span class="tally"></span>';
    rails.appendChild(rail);
    railEls.push({
      root: rail,
      input: rail.querySelector("input"),
      score: rail.querySelector(".score"),
      tally: rail.querySelector(".tally")
    });
  }

  var ballEls = [];
  var ballRow = document.getElementById("balls");
  BALLS.forEach(function (ball, idx) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "ball " + ball.cls;
    b.textContent = String(ball.value);
    b.setAttribute("aria-label", "Pot " + ball.name.toLowerCase() + ", " + ball.value + (ball.value === 1 ? " point" : " points"));
    if (idx === 0) {
      var left = document.createElement("span");
      left.className = "left";
      b.appendChild(left);
      b.leftEl = left;
    }
    b.addEventListener("click", function () { pot(ball.value); });
    ballRow.appendChild(b);
    ballEls.push(b);
  });

  var countEls = [];
  var countRow = document.getElementById("player-count");
  for (var n = MIN_PLAYERS; n <= MAX_PLAYERS; n++) {
    var c = document.createElement("button");
    c.type = "button";
    c.textContent = String(n);
    c.setAttribute("aria-label", n + " players");
    c.addEventListener("click", function (count) { return function () { setPlayers(count); }; }(n));
    countRow.appendChild(c);
    countEls.push(c);
  }

  var foulRow = document.getElementById("fouls");
  [4, 5, 6, 7].forEach(function (v) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = "Foul " + v;
    b.setAttribute("aria-label", "Foul, " + v + " points");
    b.addEventListener("click", function () { foul(v); });
    foulRow.appendChild(b);
  });

  /* ---------- actions ---------- */
  function nextPlayer() { return (state.current + 1) % state.players; }

  /* While reds remain, and for the one colour after the last red, every colour is on
     and goes back on its spot. After that the colours come off in order, so only the
     lowest one left can be potted. */
  function canPot(value) {
    if (value === 1) return state.reds > 0;
    if (state.reds > 0 || state.freeColour) return true;
    return value === state.on;
  }

  function pot(value) {
    if (!canPot(value)) return;
    snapshot();
    state.scores[state.current] += value;
    state.brk += value;
    if (state.brk > state.highs[state.current]) state.highs[state.current] = state.brk;
    if (value === 1) {
      state.reds -= 1;
      if (state.reds === 0) state.freeColour = true;
    } else if (state.freeColour) {
      state.freeColour = false;
    } else if (state.reds === 0) {
      state.on += 1;
    }
    render(state.current);
  }

  function passTurn() {
    state.brk = 0;
    state.freeColour = false;
    state.current = nextPlayer();
  }

  function foul(value) {
    snapshot();
    if (state.foulTo === "both") {
      for (var i = 0; i < state.players; i++) if (i !== state.current) state.scores[i] += value;
    } else {
      state.scores[nextPlayer()] += value;
    }
    passTurn();
    render();
  }

  function redOff() {
    if (state.reds === 0) return;
    snapshot();
    state.reds -= 1;
    render();
  }

  function endVisit() {
    snapshot();
    passTurn();
    render();
  }

  function setPlayers(count) {
    if (count === state.players) return;
    snapshot();
    // seats that leave the frame lose their points, so adding them back starts them at zero
    for (var i = count; i < MAX_PLAYERS; i++) { state.scores[i] = 0; state.highs[i] = 0; }
    if (state.current >= count) { state.current = 0; state.brk = 0; state.freeColour = false; }
    state.players = count;
    render();
  }

  function undo() {
    var prev = past.pop();
    if (!prev) return;
    var names = state.names.slice();
    state = JSON.parse(prev);
    state.names = names;
    render();
  }

  var resetArmed = null;
  function disarmReset() {
    var btn = document.getElementById("new-frame");
    clearTimeout(resetArmed);
    resetArmed = null;
    btn.textContent = "New frame";
    btn.classList.remove("armed");
  }
  function newFrame() {
    var btn = document.getElementById("new-frame");
    if (!resetArmed) {
      btn.textContent = "Tap again to reset";
      btn.classList.add("armed");
      resetArmed = setTimeout(disarmReset, 5000);
      return;
    }
    disarmReset();
    var names = state.names.slice();
    var foulTo = state.foulTo;
    var players = state.players;
    past = [];
    state = freshFrame();
    state.names = names;
    state.foulTo = foulTo;
    state.players = players;
    render();
  }

  /* ---------- render ---------- */
  function render(bumped) {
    var handed = HANDED[state.players];
    document.getElementById("handed").textContent = handed;
    document.title = handed + " Snooker";
    rails.style.setProperty("--players", String(state.players));
    countEls.forEach(function (c, k) { c.setAttribute("aria-pressed", String(k + MIN_PLAYERS === state.players)); });

    for (var i = 0; i < MAX_PLAYERS; i++) {
      var r = railEls[i];
      r.root.hidden = i >= state.players;
      var atTable = i === state.current;
      r.root.classList.toggle("at-table", atTable);
      if (r.input.value !== state.names[i]) r.input.value = state.names[i];
      r.score.textContent = String(state.scores[i]);
      r.tally.textContent = (atTable ? "Break " + state.brk : "High break " + state.highs[i]) +
        (atTable && state.highs[i] ? " \u00b7 high " + state.highs[i] : "");
      if (i === bumped) {
        r.score.classList.add("bump");
        setTimeout(function (el) { return function () { el.classList.remove("bump"); }; }(r.score), 140);
      }
    }

    ballEls.forEach(function (b, k) {
      var value = k + 1;
      b.disabled = !canPot(value);
      // a colour cleared in sequence is gone from the table
      b.classList.toggle("potted", value > 1 && state.reds === 0 && !state.freeColour && value < state.on);
    });
    ballEls[0].leftEl.textContent = state.reds + " left";
    document.getElementById("pot-label").textContent =
      state.reds > 0 ? "Pot" :
      state.freeColour ? "Pot \u2014 any colour after the last red" :
      state.on <= 7 ? "Pot \u2014 colours in order, " + BALLS[state.on - 1].name.toLowerCase() + " is on" :
      "Table cleared";
    document.getElementById("red-off").disabled = state.reds === 0;
    document.getElementById("undo").disabled = past.length === 0;

    var both = state.foulTo === "both";
    // with two players both rules give the points to the same person
    document.getElementById("foul-rule").hidden = state.players === 2;
    document.getElementById("foul-both").firstChild.nodeValue = state.players === 3 ? "Both" : "All";
    document.getElementById("foul-both").setAttribute("aria-pressed", String(both));
    document.getElementById("foul-next").setAttribute("aria-pressed", String(!both));
    document.getElementById("rule-note").textContent = both
      ? "A foul awards its points to " + (state.players === 2 ? "the opponent" : state.players === 3 ? "both opponents" : "all opponents") + " and ends the visit."
      : "A foul awards its points to the next player and ends the visit.";

    save();
  }

  /* ---------- wiring ---------- */
  railEls.forEach(function (r, i) {
    r.input.addEventListener("input", function () { state.names[i] = r.input.value; save(); });
  });
  document.getElementById("red-off").addEventListener("click", redOff);
  document.getElementById("end-visit").addEventListener("click", endVisit);
  document.getElementById("undo").addEventListener("click", undo);
  document.getElementById("new-frame").addEventListener("click", newFrame);
  document.getElementById("foul-both").addEventListener("click", function () { state.foulTo = "both"; render(); });
  document.getElementById("foul-next").addEventListener("click", function () { state.foulTo = "next"; render(); });

  var foulArmed = false;
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === "f") { foulArmed = true; return; }
    if (k >= "1" && k <= "7") {
      var v = Number(k);
      if (foulArmed) { if (v >= 4) foul(v); foulArmed = false; }
      else pot(v);
      e.preventDefault();
      return;
    }
    foulArmed = false;
    if (k === " " || k === "spacebar") { endVisit(); e.preventDefault(); }
    else if (k === "u") { undo(); e.preventDefault(); }
    else if (k === "r") { redOff(); e.preventDefault(); }
  });

  load();
  if (!native) render();
  else {
    // render() saves, so read native storage first; the splash screen covers the wait.
    loadNative().then(function () {
      render();
      if (native.StatusBar) native.StatusBar.setStyle({ style: "DARK" }).catch(function () {});
      if (native.SplashScreen) native.SplashScreen.hide().catch(function () {});
    });
  }
</script>
</body>
</html>
