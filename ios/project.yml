name: Snooker
options:
  bundleIdPrefix: com.hashtagrk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snooker:
    type: application
    platform: iOS
    sources: [Snooker]
    info:
      path: Snooker/Info.plist
      properties:
        CFBundleDisplayName: Snooker
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashtagrk.snookertracker
        PRODUCT_NAME: Snooker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  SnookerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SnookerTests]
    dependencies:
      - target: Snooker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashtagrk.snookertracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Snooker:
    build:
      targets:
        Snooker: all
        SnookerTests: [test]
    test:
      targets: [SnookerTests]
